  /* =========================================================
     隊伍管理
     ========================================================= */
  function renderTeams() {
    const D = S.data;
    $('#team-list').innerHTML = D.roster.map(t => `
      <div class="teamrow" data-id="${t.id}">
        <div class="tinfo">
          <b>${esc(t.name)}</b>
          <small>${t.players.length} 位球員${t.lineup.length ? `　先發 ${t.lineup.length}/9` : ''}</small>
        </div>
        <button class="btn sm ${D.sel.away === t.id ? 'primary' : 'ghost'}" data-act="away">客</button>
        <button class="btn sm ${D.sel.home === t.id ? 'primary' : 'ghost'}" data-act="home">主</button>
        <button class="btn sm" data-act="edit">編輯</button>
      </div>`).join('') || '<div class="empty">尚未建立隊伍</div>';
  }

  let editTeamId = null;

  function editTeam() { return S.teamById(editTeamId); }

  function renderTeam() {
    const t = editTeam();
    if (!t) { renderTeams(); showScreen('scr-teams'); return; }
    $('#team-name').value = t.name;
    const box = $('#roster');
    box.innerHTML = '';
    t.players.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'prow';
      row.innerHTML = `
        <div class="idx">${i + 1}</div>
        <input class="input" data-k="name" value="${esc(p.name)}" placeholder="球員姓名" maxlength="12">
        <input class="input no" data-k="num" value="${esc(p.num)}" placeholder="#" maxlength="2" inputmode="numeric">
        <select class="pos" data-k="pos">${S.POS.map(x => `<option${x === p.pos ? ' selected' : ''}>${x}</option>`).join('')}</select>
        <button class="del" data-del title="刪除">×</button>`;
      row.dataset.id = p.id;
      box.appendChild(row);
    });
    if (!t.players.length) box.innerHTML = `<div class="empty">尚無球員，按「＋ 新增」開始</div>`;
    $('#btn-team-del').style.opacity = S.data.roster.length <= 1 ? .35 : 1;
  }

  function bindTeams() {
    $('#btn-teams-back').addEventListener('click', () => { renderHome(); showScreen('scr-home'); });
    $('#btn-newteam').addEventListener('click', () => {
      const t = S.addTeam('新隊伍');
      editTeamId = t.id;
      renderTeam(); showScreen('scr-team');
      setTimeout(() => { const n = $('#team-name'); n && n.focus(); }, 80);
    });

    $('#team-list').addEventListener('click', e => {
      const row = e.target.closest('.teamrow'); if (!row) return;
      const id = row.dataset.id;
      const act = e.target.closest('[data-act]');
      if (act && act.dataset.act === 'edit') { editTeamId = id; renderTeam(); showScreen('scr-team'); return; }
      if (act && act.dataset.act === 'away') {
        if (S.data.sel.home === id) { toast('主隊已選這支隊伍'); return; }
        S.setSel('away', id); renderTeams(); renderHome(); return;
      }
      if (act && act.dataset.act === 'home') {
        if (S.data.sel.away === id) { toast('客隊已選這支隊伍'); return; }
        S.setSel('home', id); renderTeams(); renderHome(); return;
      }
      editTeamId = id; renderTeam(); showScreen('scr-team');
    });

    $('#btn-team-back').addEventListener('click', () => { renderTeams(); showScreen('scr-teams'); });
    $('#btn-team-done').addEventListener('click', () => { renderTeams(); showScreen('scr-teams'); });

    $('#btn-team-del').addEventListener('click', () => {
      const t = editTeam(); if (!t) return;
      if (S.data.roster.length <= 1) { toast('至少要保留一支隊伍'); return; }
      confirmSheet('刪除隊伍', `「${t.name}」與其名單、先發設定都會刪除，無法復原。`, '刪除', () => {
        S.deleteTeam(t.id);
        editTeamId = null;
        renderTeams(); showScreen('scr-teams');
        toast('已刪除隊伍');
      });
    });

    $('#team-name').addEventListener('input', e => {
      const t = editTeam(); if (!t) return;
      const v = e.target.value.trim();
      t.name = v || '未命名';
      S.save();
      renderHome();
    });

    $('#roster').addEventListener('input', e => {
      const row = e.target.closest('.prow'); if (!row) return;
      const t = editTeam(); if (!t) return;
      const p = t.players.find(x => x.id === row.dataset.id); if (!p) return;
      const k = e.target.dataset.k; if (!k) return;
      p[k] = e.target.value;
      if (k === 'num') { p[k] = p[k].replace(/\D/g, '').slice(0, 2); e.target.value = p[k]; }
      S.save();
    });
    $('#roster').addEventListener('change', e => {
      const row = e.target.closest('.prow'); if (!row) return;
      const t = editTeam(); if (!t) return;
      const p = t.players.find(x => x.id === row.dataset.id); if (!p) return;
      if (e.target.dataset.k === 'pos') { p.pos = e.target.value; S.save(); }
    });
    $('#roster').addEventListener('click', e => {
      if (!e.target.closest('[data-del]')) return;
      const row = e.target.closest('.prow');
      const t = editTeam(); if (!t) return;
      const id = row.dataset.id;
      t.players = t.players.filter(x => x.id !== id);
      t.lineup = t.lineup.filter(x => x !== id);
      if (t.pitcher === id) t.pitcher = '';
      S.save(); renderTeam();
    });

    $('#btn-add-player').addEventListener('click', () => {
      const t = editTeam(); if (!t) return;
      const n = t.players.length;
      const id = t.id + '_' + Math.random().toString(36).slice(2, 8);
      t.players.push({ id, name: '', num: '', pos: S.POS[n % 9] });
      S.save(); renderTeam();
      const box = $('#roster');
      box.lastElementChild && $('input', box.lastElementChild).focus();
      setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 60);
    });

    /* 備份 / 匯入 / 清空 */
    $('#btn-backup').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(S.data)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const d = new Date(), p = n => String(n).padStart(2, '0');
      a.download = `棒球紀錄備份_${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.json`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      toast('已下載備份');
    });
    $('#btn-import').addEventListener('click', () => $('#file-import').click());
    $('#file-import').addEventListener('change', e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          if (!S.importData(JSON.parse(rd.result))) throw new Error('bad');
          renderTeams(); renderHome();
          toast('已匯入備份');
        } catch (err) { toast('匯入失敗：檔案格式不符'); }
      };
      rd.readAsText(f);
      e.target.value = '';
    });
    $('#btn-reset-all').addEventListener('click', () => {
      confirmSheet('清空目前帳號', '目前帳號的隊伍、名單、比賽與歷史紀錄都會刪除，無法復原。建議先下載備份。', '全部清空', () => {
        S.resetAll();
        goHome();
        toast('已清空所有資料');
      });
    });
  }

  /* =========================================================
     排先發
     ========================================================= */
  let luTeam = 'away';
  let luSlot = 0;

  function prepareLineups() {
    for (const side of ['away', 'home']) {
      const t = S.selTeam(side);
      if (!t) continue;
      if (!t.lineup.length) t.lineup = t.players.slice(0, 9).map(p => p.id);
      t.lineup = t.lineup.filter(id => t.players.some(p => p.id === id));
      if (!t.pitcher || !t.players.some(p => p.id === t.pitcher)) {
        const p = t.players.find(x => x.pos === '投') || t.players[0];
        t.pitcher = p ? p.id : '';
      }
    }
    S.save();
  }

  function renderLineup() {
    const D = S.data;
    $$('#lineup-tabs button').forEach(b => {
      b.classList.toggle('on', b.dataset.team === luTeam);
      b.textContent = (b.dataset.team === 'away' ? '客 · ' : '主 · ') + S.selTeam(b.dataset.team).name;
    });
    const team = S.selTeam(luTeam);
    const players = team.players;
    const lu = team.lineup || [];
    $('#lu-title').textContent = `${team.name}　先發名單`;

    const box = $('#lu-slots');
    box.innerHTML = '';
    for (let i = 0; i < 9; i++) {
      const pid = lu[i];
      const p = pid ? players.find(x => x.id === pid) : null;
      const div = document.createElement('div');
      div.className = 'luslot' + (p ? ' filled' : '') + (i === luSlot ? ' sel' : '');
      div.style.borderColor = i === luSlot ? 'var(--gold)' : '';
      div.innerHTML = `<div class="num">${i + 1}</div>
        <div>${p ? `<b>${esc(p.name || '未命名')}</b> <span style="color:var(--mute);font-size:12px">${p.num ? '#' + esc(p.num) : ''} ${esc(p.pos || '')}</span>` : '<span style="color:var(--mute)">點選球員</span>'}</div>
        <div style="color:var(--mute)">${p ? '✕' : ''}</div>`;
      div.addEventListener('click', () => {
        if (p) {
          team.lineup = lu.filter((_, k) => k !== i);
          if (team.pitcher === pid) team.pitcher = '';
          luSlot = Math.min(team.lineup.length, 8);
          S.save(); renderLineup(); return;
        }
        luSlot = i; renderLineup();
      });
      box.appendChild(div);
    }

    const used = new Set(team.lineup || []);
    const old = box.parentElement.querySelector('.picklist');
    old && old.remove();
    const pick = document.createElement('div');
    pick.className = 'picklist';
    pick.innerHTML = players.length
      ? players.map(p => `<button class="chip${used.has(p.id) ? ' used' : ''}" data-pid="${p.id}">${esc(p.name || '未命名')}${p.num ? ' #' + esc(p.num) : ''}</button>`).join('')
      : '<span class="note">名單是空的，請先到「隊伍管理」新增球員</span>';
    box.after(pick);
    pick.addEventListener('click', e => {
      const b = e.target.closest('[data-pid]'); if (!b) return;
      const pid = b.dataset.pid;
      if (team.lineup.includes(pid)) { toast('已在先發名單中'); return; }
      if (team.lineup.length >= 9) { toast('先發名單已滿，點棒次可先移除'); return; }
      if (luSlot < 0) luSlot = team.lineup.length;
      if (team.lineup[luSlot]) team.lineup.splice(luSlot, 0, pid);
      else team.lineup[luSlot] = pid;
      team.lineup = team.lineup.slice(0, 9);
      let n = luSlot + 1; while (n < 9 && team.lineup[n]) n++;
      luSlot = n < 9 ? n : 0;
      if (!team.pitcher) team.pitcher = pid;
      S.save(); renderLineup();
    });

    const sel = $('#lu-pitcher');
    sel.innerHTML = '<option value="">— 選擇 —</option>' +
      players.map(p => `<option value="${p.id}"${team.pitcher === p.id ? ' selected' : ''}>${esc(p.name || '未命名')}${p.num ? ' #' + esc(p.num) : ''}（${esc(p.pos || '')}）</option>`).join('');
  }

  function bindLineup() {
    $$('#lineup-tabs button').forEach(b => b.addEventListener('click', () => {
      luTeam = b.dataset.team;
      luSlot = Math.min((S.selTeam(luTeam).lineup || []).length, 8);
      renderLineup();
    }));
    $('#lu-pitcher').addEventListener('change', e => {
      const t = S.selTeam(luTeam); t.pitcher = e.target.value; S.save();
    });
    $('#btn-back-home').addEventListener('click', () => { renderHome(); showScreen('scr-home'); });
    $('#btn-start').addEventListener('click', () => {
      for (const side of ['away', 'home']) {
        const t = S.selTeam(side);
        if (!t || (t.lineup || []).length < 9) {
          luTeam = side; luSlot = (t.lineup || []).length; renderLineup();
          toast(`${t.name} 還缺 ${9 - (t.lineup || []).length} 位先發`);
          return;
        }
        t.lineup = t.lineup.slice(0, 9);
        if (!t.pitcher) {
          const p = t.players.find(x => x.pos === '投') || t.players[0];
          t.pitcher = p ? p.id : '';
        }
      }
      S.save();
      S.startGame();
      Game.enter();
    });
  }

  /* =========================================================
     啟動
     ========================================================= */
  function goHome() {
    S.endView();
    if (!S.currentAccount()) { renderAccounts(); showScreen('scr-accounts'); return; }
    renderHome();
    showScreen('scr-home');
  }

  function init() {
    bindAccounts();
    bindHome();
    bindTeams();
    bindLineup();
    if (!S.currentAccount()) { renderAccounts(); showScreen('scr-accounts'); }
    else { renderHome(); showScreen('scr-home'); }
  }

  window.Setup = {
    init, goHome, renderHome, renderAccounts, renderTeams, renderTeam, renderLineup,
    get luTeam() { return luTeam; }
  };
})();

</script>
<script>
/* ---------------------------------------------------------
   game.js — 比賽畫面、逐球操作、各種面板、結果頁
   --------------------------------------------------------- */
(function () {
  'use strict';
  const { $, $$, esc, toast, showScreen, sheet, confirmSheet } = UI;

  const BASE_NAME = ['一壘', '二壘', '三壘'];
  const BASE_SHORT = ['一', '二', '三'];

  /* 即時戰況：記住使用者選的是哪一隊（每場重置） */
  let livePick = null;
  let livePickGame = null;

  /* ---------------- 小工具 ---------------- */
  function todayLine(pid) {
    const t = S.battingTeam();
    const r = S.batting(t).rows.find(x => x.pid === pid);
    return r ? r : { ab: 0, h: 0, rbi: 0, r: 0 };
  }
  function ordText(n) {
    const d = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
    return d[n] ? d[n] + '棒' : n + '棒';
  }
  function halfText(g) { return `${g.inning} 局${g.half === 'top' ? '上' : '下'}`; }

  /* ---------------- 主畫面 ---------------- */
  function render() {
    const g = S.game;
    if (!g) return;
    const root = $('#game-root');
    const ls = S.lineScore();
    const bt = S.battingTeam(), ft = S.fieldTeam();
    const bid = S.batterId(), pid = S.pitcherId();
    const bp = S.playerOf(bid), pp = S.playerOf(pid);
    const tl = todayLine(bid);
    const pitches = g.ppitch[pid] || 0;

    $('#g-title').textContent = `${g.teams.away.name} vs ${g.teams.home.name}`;
    $('#g-sub').textContent = g.finished ? '比賽結束' : `第 ${g.inning} 局　${g.half === 'top' ? '上半' : '下半'}　${g.outs} 出局`;

    const baseHtml = [0, 1, 2].map(i => {
      const r = g.bases[i];
      return `<div class="base b${i + 1}${r ? ' on' : ''}" data-base="${i}">
        <span class="dot"></span>
        ${r ? `<span class="rn">${esc(S.pname(r.pid))}</span>` : ''}
      </div>`;
    }).join('');

    root.innerHTML = `
      <div class="card scoreboard">
        <div class="sb-team ${bt === 'away' ? 'batting-on awayC' : ''}">
          <span class="nm">${esc(g.teams.away.name)}${bt === 'away' ? ' ▲' : ''}</span>
          <span class="sc ${bt === 'away' ? 'awayC' : ''}">${ls.R.away}</span>
        </div>
        <div class="sb-mid">
          <span class="inn">${g.inning} 局${g.half === 'top' ? '上' : '下'}</span>
          <span class="half">${g.finished ? 'FIN' : esc(g.teams[bt].name) + ' 進攻'}</span>
        </div>
        <div class="sb-team" style="text-align:right;align-items:flex-end">
          <span class="nm">${bt === 'home' ? '▲ ' : ''}${esc(g.teams.home.name)}</span>
          <span class="sc ${bt === 'home' ? 'homeC' : ''}">${ls.R.home}</span>
        </div>
      </div>

      <div class="card" style="padding:6px 10px">
        <div class="diamondwrap">
          <div class="diamond">
            ${baseHtml}
            <div class="base home"></div>
          </div>
          <div class="countbox">
            <div class="crow"><span class="clabel">B</span>${[0, 1, 2].map(i => `<span class="cdot b${g.balls > i ? ' on' : ''}"></span>`).join('')}<b style="margin-left:4px;font-size:13px">${g.balls}</b></div>
            <div class="crow"><span class="clabel">S</span>${[0, 1].map(i => `<span class="cdot s${g.strikes > i ? ' on' : ''}"></span>`).join('')}<b style="margin-left:4px;font-size:13px">${g.strikes}</b></div>
            <div class="crow"><span class="clabel">O</span>${[0, 1, 2].map(i => `<span class="outdot${g.outs > i ? ' on' : ''}"></span>`).join('')}<b style="margin-left:4px;font-size:13px">${g.outs}</b></div>
            <div style="font-size:11px;color:var(--mute)">${esc(S.pname(pid))} · ${pitches} 球</div>
            <div style="font-size:10px;color:var(--mute);opacity:.8">點壘包記盜壘</div>
          </div>
        </div>
      </div>

      <div class="card battercard">
        <div class="who">
          <b>${bp.num ? '#' + esc(bp.num) + ' ' : ''}${esc(bp.name || '未命名')}</b>
          <span>${ordText(S.batterOrder())} · ${esc(bp.pos || '')} · 今日 ${tl.h}-${tl.ab}</span>
        </div>
        <div class="countctl">
          <button data-p="ball" title="壞球：球數 +1">壞球<small style="font-size:10px;color:var(--mute)">+1</small></button>
          <button data-p="foul" title="界外：未滿 2 好球記 1 好球；2 好球後只加球數">界外<small style="font-size:10px;color:var(--mute)">+1</small></button>
          <button data-p="strike" title="好球：好球數 +1">好球<small style="font-size:10px;color:var(--mute)">+1</small></button>
        </div>
      </div>

      <div class="actions">
        <button class="act hit" data-a="hit">安打<small>選擇壘打數</small></button>
        <button class="act bb" data-a="walk">保送<small>四壞 / 觸身</small></button>
        <button class="act out" data-a="out">出局<small>方式＋傳球</small></button>
      </div>

      <div class="grid3" style="gap:8px">
        <button class="act more" data-a="other">失誤 / 野選</button>
        <button class="act more" data-a="run">盜壘 / 推進</button>
        <button class="act more" data-a="undo">↩ 復原</button>
      </div>

      <div class="footrow">
        <button class="btn sm" data-f="sub">選手</button>
        <button class="btn sm" data-f="pitcher">換投</button>
        <button class="btn sm" data-f="live">戰況</button>
        <button class="btn sm" data-f="log">紀錄</button>
        <button class="btn sm" data-f="finish">結束</button>
      </div>

      <button class="side left" data-f="menu">選單</button>
      <button class="side right" data-f="sub">選手</button>
    `;

    root.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => onPitch(b.dataset.p)));
    root.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => onAction(b.dataset.a)));
    root.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => onFoot(b.dataset.f)));
    root.querySelectorAll('[data-base]').forEach(b => b.addEventListener('click', () => openRunner(+b.dataset.base)));
    const dia = root.querySelector('.diamond');
    dia.addEventListener('click', e => { if (!e.target.closest('[data-base]')) openRunner(-1); });
  }

  function after() {
    const g = S.game;
    if (g.finished) { showResult(); return; }
    render();
  }

  function onPitch(kind) {
    const g = S.game;
    if (g.finished) return;
    if (kind === 'ball') {
      const r = S.ball();
      if (r && r.auto === 'walk') {
        S.applyPlay({ kind: 'walk', code: '四壞', dest: S.autoDest({ kind: 'walk' }) });
        S.mergeLastSnapshot();
        toast('四壞球保送');
        after(); return;
      }
    } else if (kind === 'foul') {
      const r = S.foul();
      if (r && !r.addedStrike) toast('界外：球數 +1，維持 2 好球');
      render(); return;
    } else {
      const r = S.strike();
      if (r && r.auto === 'strikeout') {
        // 第 3 顆好球已由 strike() 計入球數，不再重複加
        S.applyPlay({ kind: 'out', code: '三振', dest: S.autoDest({ kind: 'out', code: '三振' }), pitch: false });
        S.mergeLastSnapshot();
        toast('三振出局');
        after(); return;
      }
    }
    render();
  }

  function onAction(a) {
    if (S.game.finished) { toast('比賽已結束'); return; }
    if (a === 'hit') openHit();
    if (a === 'walk') openWalk();
    if (a === 'out') openOut();
    if (a === 'other') openOther();
    if (a === 'run') openRunner(-1);
    if (a === 'undo') doUndo();
  }

  function doUndo() {
    if (S.undo()) { toast('已復原上一步'); render(); }
    else toast('沒有可復原的動作');
  }

  /* ---------------- 安打 ---------------- */
  function openHit() {
    const s = sheet({
      title: '安打',
      hint: '先選壘打數，下一步再設定跑者推進',
      body: `<div class="grid2">
        <button class="opt" data-n="1">一壘安打<small>1 base</small></button>
        <button class="opt" data-n="2">二壘安打<small>2 bases</small></button>
        <button class="opt" data-n="3">三壘安打<small>3 bases</small></button>
        <button class="opt" data-n="4" style="grid-column:1/-1">全 壘 打<small>home run</small></button>
      </div>`
    });
    s.body.addEventListener('click', e => {
      const b = e.target.closest('[data-n]'); if (!b) return;
      s.close();
      const n = +b.dataset.n;
      runPlay({ kind: 'hit', bases: n, code: ['', '一安', '二安', '三安', '全壘打'][n] });
    });
  }

  /* ---------------- 保送 ---------------- */
  function openWalk() {
    const s = sheet({
      title: '保送',
      body: `<div class="grid3">
        <button class="opt" data-c="四壞">四壞球</button>
        <button class="opt" data-c="故意四壞">故意四壞</button>
        <button class="opt" data-c="觸身球">觸身球</button>
      </div>`
    });
    s.body.addEventListener('click', e => {
      const b = e.target.closest('[data-c]'); if (!b) return;
      s.close();
      const code = b.dataset.c;
      runPlay({ kind: code === '觸身球' ? 'hbp' : 'walk', code });
    });
  }

  /* ---------------- 其他 ---------------- */
  function openOther() {
    const s = sheet({
      title: '其他上壘',
      hint: '失誤與野選不計安打，也不計打點',
      body: `<div class="grid2">
        <button class="opt" data-c="失誤">失　誤<small>因失誤上壘</small></button>
        <button class="opt" data-c="野選">野　選<small>野手選擇</small></button>
      </div>`
    });
    s.body.addEventListener('click', e => {
      const b = e.target.closest('[data-c]'); if (!b) return;
      s.close();
      runPlay({ kind: 'other', code: b.dataset.c, rbi: false });
    });
  }

  /* ---------------- 出局 ---------------- */
  const OUTS = [
    ['三振', 'K'], ['滾地出局', 'GO'], ['飛球接殺', 'FO'], ['平飛接殺', 'LO'],
    ['界外接殺', 'Foul'], ['雙殺', 'DP'], ['犧短', 'SAC'], ['犧飛', 'SF'], ['妨礙打擊', 'CI']
  ];
  const FIELDERS = [['1', '投'], ['2', '捕'], ['3', '一'], ['4', '二'], ['5', '三'], ['6', '游'], ['7', '左'], ['8', '中'], ['9', '右']];

  function openOut() {
    let type = '';
    let seq = [];
    const s = sheet({
      title: '出局',
      hint: '選出局方式 → 依傳球順序點守位（例：6 → 4 → 3）',
      body: `<div class="grid3" id="outtypes"></div>
        <hr class="sep">
        <div class="seq" id="seq">—</div>
        <div class="fielders" id="fld" style="margin-top:8px"></div>
        <div class="row" style="margin-top:10px;gap:8px">
          <button class="btn sm ghost" data-clear>清除傳球</button>
          <div class="spacer"></div>
          <span class="note" id="outnote"></span>
        </div>`,
      actions: `<button class="btn ghost block" data-x>取消</button><button class="btn primary block" data-ok>確定</button>`
    });

    const typesBox = $('#outtypes', s.el);
    typesBox.innerHTML = OUTS.map(([t, tag]) => `<button class="opt" data-t="${t}">${t}<small>${tag}</small></button>`).join('');
    const fldBox = $('#fld', s.el);
    fldBox.innerHTML = FIELDERS.map(([n, p]) => `<button class="fld" data-f="${n}">${n}<small style="font-weight:600;font-size:11px;display:block;color:var(--mute)">${p}</small></button>`).join('');
    const seqEl = $('#seq', s.el);
    const noteEl = $('#outnote', s.el);

    function paint() {
      typesBox.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('sel', b.dataset.t === type));
      seqEl.textContent = seq.length ? seq.join(' - ') : '—';
      noteEl.textContent = seq.length ? `傳球 ${seq.join('-')}` : '';
    }
    typesBox.addEventListener('click', e => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      type = b.dataset.t;
      if (type === '三振') { /* 傳球可留空 */ }
      paint();
    });
    fldBox.addEventListener('click', e => {
      const b = e.target.closest('[data-f]'); if (!b) return;
      if (seq.length >= 4) seq.shift();
      seq.push(b.dataset.f);
      paint();
    });
    s.el.addEventListener('click', e => {
      if (e.target.closest('[data-clear]')) { seq = []; paint(); }
      if (e.target.closest('[data-x]')) s.close();
      if (e.target.closest('[data-ok]')) {
        if (!type) { toast('請先選出局方式'); return; }
        s.close();
        const opt = { kind: type === '妨礙打擊' ? 'other' : 'out', code: type, seq: seq.join('-') };
        runPlay(opt);
      }
    });
    paint();
  }

  /* ---------------- 跑者推進（通用） ---------------- */
  function runPlay(opt) {
    // 有跑者需要移動才開推進面板，否則直接記錄
    const auto = S.autoDest(opt);
    const moves = auto.some((d, i) => i < 3 && d !== null && d !== undefined && d !== i);
    if (moves) openAdvance(opt);
    else commit(Object.assign({}, opt, { dest: auto }));
  }

  function openAdvance(opt) {
    const g = S.game;
    const auto = S.autoDest(opt);
    const dest = auto.map((d, i) => (d === null || d === undefined) ? (i < 3 && g.bases[i] ? i : (i === 3 ? 0 : null)) : d);

    const rows = [];
    for (let i = 0; i < 3; i++) {
      if (g.bases[i]) rows.push({ i, pid: g.bases[i].pid, label: BASE_NAME[i] + '跑者' });
    }
    rows.push({ i: 3, pid: S.batterId(), label: '打　者' });

    const s = sheet({
      title: opt.kind === 'hit' ? (opt.code + '　跑者推進') : '跑者推進',
      hint: '點選每位跑者的最終壘包；三壘跑者回本壘即得分',
      body: rows.map(r => `
        <div class="runner" data-i="${r.i}">
          <div class="nm">${esc(S.pname(r.pid))}<small>${r.label}</small></div>
          <div class="destbtns">
            ${[0, 1, 2].map(b => `<button data-d="${b}" class="${dest[r.i] === b ? 'on' : ''}">${BASE_SHORT[b]}</button>`).join('')}
            <button data-d="home" class="${dest[r.i] === 'home' ? 'on' : ''}">本</button>
            <button data-d="out" class="${dest[r.i] === 'out' ? 'out' : ''}">出局</button>
          </div>
        </div>`).join('') +
        `<div class="row" style="justify-content:space-between;margin-top:6px">
          <span class="note" id="runprev"></span>
          <button class="btn sm ghost" data-auto>自動推進</button>
        </div>`,
      actions: `<button class="btn ghost block" data-x>取消</button><button class="btn primary block" data-ok>確定</button>`
    });

    function preview() {
      let runs = 0, outs = 0;
      rows.forEach(r => {
        const d = dest[r.i];
        if (d === 'home') runs++;
        if (d === 'out') outs++;
      });
      $('#runprev', s.el).textContent = `得分 +${runs}　出局 +${outs}`;
    }
    s.body.addEventListener('click', e => {
      const b = e.target.closest('[data-d]');
      if (b) {
        const row = b.closest('[data-i]');
        const i = +row.dataset.i;
        const d = b.dataset.d;
        dest[i] = d === 'home' || d === 'out' ? d : +d;
        row.querySelectorAll('[data-d]').forEach(x => {
          x.classList.toggle('on', x.dataset.d === d && d !== 'out');
          x.classList.toggle('out', x.dataset.d === 'out' && d === 'out');
        });
        preview(); return;
      }
      if (e.target.closest('[data-auto]')) {
        s.close();
        commit(Object.assign({}, opt, { dest: S.autoDest(opt) }));
      }
    });
    s.el.addEventListener('click', e => {
      if (e.target.closest('[data-x]')) s.close();
      if (e.target.closest('[data-ok]')) {
        s.close();
        commit(Object.assign({}, opt, { dest: dest.slice() }));
      }
    });
    preview();
  }

  function commit(opt) {
    const before = { inn: S.game.inning, half: S.game.half };
    S.applyPlay(opt);
    const g = S.game;
    const rec = g.pa[g.pa.length - 1];
    const changed = g.inning !== before.inn || g.half !== before.half;
    if (changed && !g.finished) {
      toast(`三出局　${g.inning} 局${g.half === 'top' ? '上' : '下'}`);
    } else {
      toast(rec ? `${rec.code}${rec.runs ? '　+' + rec.runs + ' 分' : ''}` : '已記錄');
    }
    after();
  }

  /* ---------------- 盜壘 / 跑者動作 ---------------- */
  function openRunner(idx) {
    const g = S.game;
    if (!g.bases.some(Boolean)) { toast('壘上目前沒有人'); return; }
    if (idx < 0) {
      const s = sheet({
        title: '壘上跑者',
        hint: '選擇要處理的跑者',
        body: [0, 1, 2].filter(i => g.bases[i]).map(i =>
          `<button class="runner" data-b="${i}" style="width:100%;text-align:left">
            <div class="nm">${esc(S.pname(g.bases[i].pid))}<small>${BASE_NAME[i]}</small></div>
            <div style="color:var(--gold)">›</div>
          </button>`).join('')
      });
      s.body.addEventListener('click', e => {
        const b = e.target.closest('[data-b]'); if (!b) return;
        s.close(); openRunner(+b.dataset.b);
      });
      return;
    }
    const r = g.bases[idx];
    if (!r) { toast('這個壘包沒有人'); return; }
    const s = sheet({
      title: `${BASE_NAME[idx]}跑者`, hint: esc(S.pname(r.pid)),
      body: `<div class="grid2">
        <button class="opt" data-act="steal">盜　壘<small>${idx === 2 ? '盜本壘' : '推進 ' + BASE_NAME[idx + 1]}</small></button>
        <button class="opt" data-act="cs">盜壘刺<small>出局</small></button>
        <button class="opt" data-act="adv">推進一壘<small>暴投／捕逸／趁傳</small></button>
        <button class="opt" data-act="home">回本壘<small>得分</small></button>
        <button class="opt" data-act="pick" style="grid-column:1/-1">牽制出局<small>投手牽制抓到</small></button>
      </div>`
    });
    s.body.addEventListener('click', e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      s.close();
      S.runnerAction(idx, b.dataset.act);
      after();
    });
  }

  /* ---------------- 換投手 ---------------- */
  function openPitcher() {
    const g = S.game;
    if (g.finished) { toast('比賽已結束'); return; }
    const team = S.fieldTeam();
    const cur = S.pitcherId(team);
    const players = g.teams[team].players;
    const ps = S.pitching(team).rows.find(x => x.pid === cur);

    const s = sheet({
      title: '更換投手',
      hint: `${esc(g.teams[team].name)}　目前：${esc(S.pfull(cur))}${ps ? `（${ps.ip} 局 · ${ps.pitches} 球）` : ''}`,
      body: `<div class="grid2" id="plist">
        ${players.map(p => `<button class="opt${p.id === cur ? ' sel' : ''}" data-p="${p.id}">
          ${esc(p.name || '未命名')}<small>${p.num ? '#' + esc(p.num) + '　' : ''}${esc(p.pos || '')}</small>
        </button>`).join('')}
      </div>`
    });
    s.body.addEventListener('click', e => {
      const b = e.target.closest('[data-p]'); if (!b) return;
      const pid = b.dataset.p;
      if (pid === cur) { s.close(); return; }
      s.close();
      confirmSheet('更換投手', `換上 ${S.pfull(pid)}？`, '換投', () => {
        S.changePitcher(team, pid);
        toast('已換投：' + S.pname(pid));
        after();
      });
    });
  }

  /* ---------------- 選手異動 ---------------- */
  function benchPicker(title, team, onPick) {
    const list = S.bench(team);
    const s = sheet({
      title,
      hint: list.length ? '從板凳選擇選手' : '',
      body: list.length
        ? `<div class="grid2">${list.map(p => `<button class="opt" data-pid="${p.id}">
            ${esc(p.name || '未命名')}<small>${p.num ? '#' + esc(p.num) + '　' : ''}${esc(p.pos || '')}</small>
          </button>`).join('')}</div>`
        : '<div class="empty">沒有可替換的選手<br>可先到「隊伍管理」新增球員</div>'
    });
    s.body.addEventListener('click', e => {
      const b = e.target.closest('[data-pid]'); if (!b) return;
      s.close();
      onPick(b.dataset.pid);
    });
  }

  function openSub() {
    const g = S.game;
    if (!g) return;
    if (S.isViewing()) { toast('歷史回顧不能異動'); return; }
    if (g.finished) { toast('比賽已結束'); return; }

    const fieldTeam = S.fieldTeam();
    const batTeam = S.battingTeam();
    let tab = 'field';
    let swapSel = '';

    const s = sheet({
      title: '選手異動',
      hint: `${esc(g.teams[fieldTeam].name)} 守備　·　${esc(g.teams[batTeam].name)} 進攻`,
      body: `<div class="seg" id="subTabs">
          <button data-t="field" class="on">守備異動</button>
          <button data-t="bat">代打 / 代跑</button>
        </div>
        <div id="subBody"></div>`
    });

    const body = $('#subBody', s.el);
    const tabs = $('#subTabs', s.el);
    tabs.addEventListener('click', e => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      tab = b.dataset.t; swapSel = '';
      tabs.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.t === tab));
      paint();
    });

    function ordOf(pid) {
      const i = (g.lineup[fieldTeam] || []).indexOf(pid);
      return i >= 0 ? `第 ${i + 1} 棒` : '';
    }

    function fieldHtml() {
      const def = S.defenseOf(fieldTeam);
      const rows = S.FIELD.filter(pos => def[pos]).map(pos => {
        const pid = def[pos];
        return `<div class="subrow${swapSel === pos ? ' sel' : ''}" data-pos="${pos}">
          <span class="posbadge">${pos}</span>
          <span class="subname">${esc(S.pname(pid))}<small>${pos === '投' ? '投手' : ordOf(pid)}</small></span>
          <button class="btn sm ghost" data-rep="${pos}">更換</button>
          <button class="btn sm ${swapSel === pos ? 'primary' : 'ghost'}" data-swap="${pos}">↔</button>
        </div>`;
      }).join('');
      return `<p class="note" style="margin:2px 0 8px">${swapSel ? '再點另一個守位的 ↔ 即可互換' : '「更換」換上板凳選手；「↔」互換兩個守位'}</p>
        <div class="sublist">${rows || '<div class="empty">沒有守備資料</div>'}</div>`;
    }

    function batHtml() {
      const bid = S.batterId();
      const slot = (g.batIdx[batTeam] % 9) + 1;
      let h = `<div class="subrow">
        <span class="posbadge">打</span>
        <span class="subname">${esc(S.pname(bid))}<small>第 ${slot} 棒 · 目前打者</small></span>
        <button class="btn sm" data-ph>代打</button>
      </div>`;
      const rs = [0, 1, 2].filter(i => g.bases[i]);
      h += `<p class="note" style="margin:12px 0 6px">壘上跑者</p>`;
      h += rs.length ? rs.map(i => `<div class="subrow">
          <span class="posbadge">${['一', '二', '三'][i]}</span>
          <span class="subname">${esc(S.pname(g.bases[i].pid))}<small>${['一', '二', '三'][i]}壘跑者</small></span>
          <button class="btn sm ghost" data-pr="${i}">代跑</button>
        </div>`).join('') : '<div class="empty" style="padding:12px">壘上目前沒有人</div>';
      return h;
    }

    function paint() { body.innerHTML = tab === 'field' ? fieldHtml() : batHtml(); }
    paint();

    body.addEventListener('click', e => {
      const rep = e.target.closest('[data-rep]');
      if (rep) {
        const pos = rep.dataset.rep;
        const def = S.defenseOf(fieldTeam);
        const oldPid = def[pos];
        benchPicker(`更換 ${pos}：${S.pname(oldPid)}`, fieldTeam, pid => {
          if (!S.substitute(fieldTeam, oldPid, pid)) { toast('無法更換這位選手'); return; }
          s.close();
          toast(`已換上 ${S.pname(pid)}`);
          after();
        });
        return;
      }
      const sw = e.target.closest('[data-swap]');
      if (sw) {
        const pos = sw.dataset.swap;
        if (!swapSel) { swapSel = pos; paint(); return; }
        if (swapSel === pos) { swapSel = ''; paint(); return; }
        const a = swapSel;
        swapSel = '';
        if (S.swapPositions(fieldTeam, a, pos)) {
          s.close(); toast('已互換守位'); after();
        } else { toast('無法互換'); paint(); }
        return;
      }
      const ph = e.target.closest('[data-ph]');
      if (ph) {
        const oldPid = S.batterId();
        benchPicker(`代打：${S.pname(oldPid)}`, batTeam, pid => {
          if (!S.pinchHitter(pid)) { toast('無法更換這位選手'); return; }
          s.close();
          toast(`代打：${S.pname(pid)}`);
          after();
        });
        return;
      }
      const pr = e.target.closest('[data-pr]');
      if (pr) {
        const idx = +pr.dataset.pr;
        const oldPid = g.bases[idx] && g.bases[idx].pid;
        benchPicker(`代跑：${S.pname(oldPid)}`, batTeam, pid => {
          if (!S.pinchRunner(idx, pid)) { toast('無法更換這位選手'); return; }
          s.close();
          toast(`代跑：${S.pname(pid)}`);
          after();
        });
      }
    });
  }

  /* ---------------- 即時戰況 ---------------- */
  function openLive() {
    const g = S.game;
    if (!g) return;
    if (livePickGame !== g.id) { livePickGame = g.id; livePick = null; }
    const ls = S.lineScore();
    const a = g.teams.away.name, h = g.teams.home.name;
    const bt = S.battingTeam(), ft = S.fieldTeam();
    const bid = S.batterId(), pid = S.pitcherId();
    const bases = [0, 1, 2].filter(i => g.bases[i]).map(i => `${['一', '二', '三'][i]}壘 ${esc(S.pname(g.bases[i].pid))}`).join('　') || '無人在壘';
    const def = S.defenseOf(ft);
    const defTxt = S.FIELD.filter(p => def[p]).map(p => `${p} ${esc(S.pname(def[p]))}`).join('　');

    // 逐局記分板：與結果頁相同，另標示目前局數與進攻方
    const cur = g.finished ? 0 : g.inning;
    const innTh = Array.from({ length: ls.innings }, (_, i) =>
      `<th${i + 1 === cur ? ' class="li"' : ''}>${i + 1}</th>`).join('');
    const innTd = (arr) => arr.map((v, i) =>
      `<td${i + 1 === cur ? ' class="li"' : ''}>${v}</td>`).join('');
    const row = (side, name, cls) => `<tr class="${bt === side && !g.finished ? 'livebat' : ''}">
      <td class="nm"><span class="lvbadge ${side === 'away' ? 'a' : 'h'}">${side === 'away' ? '客' : '主'}</span>${esc(name)}${bt === side && !g.finished ? ' ▲' : ''}</td>
      ${innTd(ls[side])}<td><b>${ls.R[side]}</b></td><td>${ls.H[side]}</td><td>${ls.E[side]}</td>
    </tr>`;

    const pick = (livePick === 'away' || livePick === 'home') ? livePick : bt;

    const s = sheet({
      title: '即時戰況',
      hint: `${halfText(g)}　${g.outs} 出局　B ${g.balls} · S ${g.strikes}　·　${esc(g.teams[bt].name)} 進攻`,
      body: `
        <div class="livehero">
          <div class="lhteam"><span>客　${esc(a)}</span><b class="awayC">${ls.R.away}</b></div>
          <div class="lhmid">${g.inning} 局${g.half === 'top' ? '上' : '下'}<small>${g.outs} 出局</small></div>
          <div class="lhteam tr"><span>主　${esc(h)}</span><b class="homeC">${ls.R.home}</b></div>
        </div>
        <div class="livenow">
          <div><span>打者</span><b>${esc(S.pname(bid))}</b></div>
          <div><span>投手</span><b>${esc(S.pname(pid))}</b></div>
          <div><span>壘上</span><b>${bases}</b></div>
        </div>
        <p class="note" style="margin:8px 0 12px">守備（${esc(g.teams[ft].name)}）：${defTxt || '—'}</p>

        <h3 class="liveh">逐局紀錄</h3>
        <div class="scrollx" style="margin-bottom:14px"><table class="tbl livescore">
          <thead><tr><th style="min-width:88px">球隊</th>${innTh}<th>R</th><th>H</th><th>E</th></tr></thead>
          <tbody>${row('away', a)}${row('home', h)}</tbody>
        </table></div>

        <div class="seg lvtabs" id="liveTabs">
          <button data-lt="away" class="${pick === 'away' ? 'on' : ''}"><span class="lvbadge a">客</span>${esc(a)}</button>
          <button data-lt="home" class="${pick === 'home' ? 'on' : ''}"><span class="lvbadge h">主</span>${esc(h)}</button>
        </div>
        <p class="note" style="margin:0 0 8px">只顯示所選隊伍的選手戰況</p>

        <div class="liveblock${pick === 'away' ? '' : ' hide'}" data-lt="away">
          <p class="livesub">逐局打席（安打種類／出局方式）</p>${paLogHtml('away')}
          <p class="livesub">投手成績</p>${pitTable('away')}
        </div>
        <div class="liveblock${pick === 'home' ? '' : ' hide'}" data-lt="home">
          <p class="livesub">逐局打席（安打種類／出局方式）</p>${paLogHtml('home')}
          <p class="livesub">投手成績</p>${pitTable('home')}
        </div>

        <div class="row" style="margin-top:12px">
          <button class="btn block" data-refresh>重新整理</button>
        </div>`
    });
    const lvTabs = $('#liveTabs', s.el);
    lvTabs.addEventListener('click', e => {
      const b = e.target.closest('[data-lt]'); if (!b) return;
      const t = b.dataset.lt;
      livePick = t;
      lvTabs.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.lt === t));
      s.el.querySelectorAll('.liveblock').forEach(x => x.classList.toggle('hide', x.dataset.lt !== t));
    });
    s.body.addEventListener('click', e => {
      if (!e.target.closest('[data-refresh]')) return;
      s.close(); openLive();
    });
  }

  /* ---------------- 紀錄 ---------------- */
  function openLog() {
    const g = S.game;
    const list = g.events.slice().reverse();
    const s = sheet({
      title: '比賽紀錄',
      body: `<div class="log">${list.length ? list.map(e => `
        <div class="logrow">
          <span class="tag">${e.inn ? e.inn + (e.half === 'top' ? '上' : '下') : ''}</span>
          <span class="res">${esc(e.text || '')}</span>
          <span class="rbi">${e.rbi ? '+' + e.rbi : ''}</span>
        </div>`).join('') : '<div class="empty">尚無紀錄</div>'}</div>`
    });
  }

  /* ---------------- 選單 ---------------- */
  function openMenu() {
    const s = sheet({
      title: '選單',
      body: `<div class="grid2">
        <button class="opt" data-m="undo">↩ 復原上一步</button>
        <button class="opt" data-m="log">比賽紀錄</button>
        <button class="opt" data-m="sub">選手異動</button>
        <button class="opt" data-m="live">即時戰況</button>
        <button class="opt" data-m="pitcher">更換投手</button>
        <button class="opt" data-m="finish">提早結束</button>
        <button class="opt" data-m="excel">輸出 Excel</button>
        <button class="opt" data-m="result">查看結果</button>
        <button class="opt" data-m="help">使用說明</button>
        <button class="opt" data-m="home">回到首頁（比賽保留）</button>
      </div>`
    });
    s.body.addEventListener('click', e => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      const m = b.dataset.m; s.close();
      if (m === 'undo') doUndo();
      if (m === 'log') openLog();
      if (m === 'sub') openSub();
      if (m === 'live') openLive();
      if (m === 'pitcher') openPitcher();
      if (m === 'finish') doFinish();
      if (m === 'excel') Export.xlsx();
      if (m === 'result') showResult();
      if (m === 'help') Help.open();
      if (m === 'home') { S.save(); Setup.goHome(); }
    });
  }

  function doFinish() {
    const g = S.game;
    if (g.finished) { showResult(); return; }
    const ls = S.lineScore();
    confirmSheet('提早結束比賽',
      `${halfText(g)}　${g.teams.away.name} ${ls.R.away} : ${ls.R.home} ${g.teams.home.name}　— 確定結束並結算？`,
      '結束比賽', () => {
        S.finish('提前結束');
        showResult();
      });
  }

  function onFoot(f) {
    if (f === 'sub') openSub();
    if (f === 'pitcher') openPitcher();
    if (f === 'live') openLive();
    if (f === 'log') openLog();
    if (f === 'finish') doFinish();
    if (f === 'excel') Export.xlsx();
    if (f === 'menu') openMenu();
  }

  /* ---------------- 結果頁 ---------------- */
  let archiveView = false;

  function batTable(team) {
    const { rows, tot } = S.batting(team);
    const avg = (h, ab) => ab ? (h / ab).toFixed(3).replace(/^0/, '') : '—';
    return `<div class="scrollx"><table class="tbl">
      <thead><tr><th>棒次</th><th>球員</th><th>打數</th><th>安打</th><th>二</th><th>三</th><th>全</th><th>打點</th><th>得分</th><th>四壞</th><th>三振</th><th>盜壘</th><th>打擊率</th></tr></thead>
      <tbody>
      ${rows.map(r => `<tr>
        <td>${r.order || ''}</td>
        <td class="nm">${esc(r.name)}${r.num ? ' <span style="color:var(--mute)">#' + esc(r.num) + '</span>' : ''}</td>
        <td>${r.ab}</td><td>${r.h}</td><td>${r.b2 || ''}</td><td>${r.b3 || ''}</td><td>${r.hr || ''}</td>
        <td>${r.rbi}</td><td>${r.r}</td><td>${r.bb}</td><td>${r.k}</td><td>${r.sb}</td><td>${avg(r.h, r.ab)}</td>
      </tr>`).join('')}
      <tr class="tot"><td></td><td class="nm">合計</td><td>${tot.ab}</td><td>${tot.h}</td><td>${tot.b2}</td><td>${tot.b3}</td><td>${tot.hr}</td><td>${tot.rbi}</td><td>${tot.r}</td><td>${tot.bb}</td><td>${tot.k}</td><td>${tot.sb}</td><td>${avg(tot.h, tot.ab)}</td></tr>
      </tbody></table></div>`;
  }

  function pitTable(team) {
    const { rows } = S.pitching(team);
    return `<div class="scrollx"><table class="tbl">
      <thead><tr><th>投手</th><th>局數</th><th>打席</th><th>球數</th><th>被安</th><th>被全</th><th>四壞</th><th>死球</th><th>三振</th><th>失分</th><th>自責</th><th>防禦率</th></tr></thead>
      <tbody>${rows.length ? rows.map(r => `<tr>
        <td class="nm">${esc(r.name)}${r.num ? ' <span style="color:var(--mute)">#' + esc(r.num) + '</span>' : ''}</td>
        <td>${r.ip}</td><td>${r.bf}</td><td>${r.pitches}</td><td>${r.h}</td><td>${r.hr || 0}</td>
        <td>${r.bb}</td><td>${r.hbp}</td><td>${r.k}</td><td>${r.r}</td><td>${r.er}</td>
        <td>${r.era == null ? '—' : r.era.toFixed(2)}</td></tr>`).join('') : '<tr><td colspan="12" style="color:var(--mute)">無資料</td></tr>'}</tbody></table></div>`;
  }

  /* ---------------- 逐局打席紀錄 ---------------- */
  function paResultText(rec) {
    const base = { 1: '一安', 2: '二安', 3: '三安', 4: '全壘打' };
    if (rec.kind === 'hit') return { text: base[rec.bases] || '安打', cls: 'hit' };
    if (rec.kind === 'hbp') return { text: '觸身球', cls: 'bb' };
    if (rec.kind === 'walk') return { text: rec.code || '保送', cls: 'bb' };
    if (rec.kind === 'out') return { text: (rec.code || '出局') + (rec.seq ? '（' + rec.seq + '）' : ''), cls: 'out' };
    return { text: rec.code || '—', cls: '' };
  }

  /* team 省略＝兩隊依局數交錯；showTeam＝標出隊名 */
  function paLogHtml(team, showTeam) {
    const g = S.game;
    if (!g) return '';
    const list = g.pa.filter(p => !team || p.team === team);
    if (!list.length) return '<div class="paEmpty">尚無打席紀錄</div>';

    const groups = [], map = {};
    list.forEach(p => {
      const key = p.inn + '|' + p.half;
      if (!map[key]) {
        map[key] = { inn: p.inn, half: p.half, team: p.team, runs: 0, rows: [] };
        groups.push(map[key]);
      }
      map[key].rows.push(p);
      map[key].runs += p.runs || 0;
    });
    groups.sort((a, b) => (a.inn - b.inn) || ((a.half === 'top' ? 0 : 1) - (b.half === 'top' ? 0 : 1)));

    return `<div class="paList">${groups.map(grp => `
      <div class="paInn">
        <h4>
          <span>第 ${grp.inn} 局${grp.half === 'top' ? '上' : '下'}${showTeam ? '　·　' + esc(g.teams[grp.team].name) : ''}</span>
          <small>${grp.rows.length} 打席${grp.runs ? '　·　' + grp.runs + ' 分' : ''}</small>
        </h4>
        ${grp.rows.map(rec => {
          const r = paResultText(rec);
          const tag = rec.rbi ? rec.rbi + ' 打點' : (rec.runs ? rec.runs + ' 分' : '');
          return `<div class="paLine">
            <span class="ord">${rec.order ? rec.order + '棒' : ''}</span>
            <span class="nm">${esc(S.pname(rec.batter))}</span>
            <span class="res ${r.cls}">${esc(r.text)}</span>
            <span class="rbi">${tag}</span>
          </div>`;
        }).join('')}
      </div>`).join('')}</div>`;
  }

  function showResult(game) {
    if (game) { S.viewGame(game); archiveView = true; }
    else { S.endView(); archiveView = false; }

    const g = S.game;
    if (!g) { Setup.goHome(); return; }

    const live = !archiveView && g === S.data.game;
    const ls = S.lineScore();
    const a = g.teams.away.name, h = g.teams.home.name;
    const win = ls.R.away === ls.R.home ? '和局' : (ls.R.away > ls.R.home ? a + ' 勝' : h + ' 勝');

    const innTh = Array.from({ length: ls.innings }, (_, i) => `<th>${i + 1}</th>`).join('');
    const innTd = (arr) => arr.map(v => `<td>${v}</td>`).join('');

    $('#result-root').innerHTML = `
      <div class="card" style="margin-bottom:10px">
        <div class="final">
          <div class="t"><b>${esc(a)}</b><span class="awayC">${ls.R.away}</span></div>
          <div class="vs">:</div>
          <div class="t"><b>${esc(h)}</b><span class="homeC">${ls.R.home}</span></div>
        </div>
        <div style="text-align:center;color:var(--gold);font-weight:800;font-size:13px">${esc(win)}</div>
        <div style="text-align:center;color:var(--mute);font-size:12px;margin-top:4px">
          ${archiveView ? '歷史回顧　·　' : ''}${esc(g.finishReason || '比賽進行中')}　·　${g.finished ? '已結束' : halfText(g)}
        </div>
      </div>

      <div class="scrollx" style="margin-bottom:12px"><table class="tbl">
        <thead><tr><th style="min-width:70px">球隊</th>${innTh}<th>R</th><th>H</th><th>E</th></tr></thead>
        <tbody>
          <tr><td class="nm">${esc(a)}</td>${innTd(ls.away)}<td><b>${ls.R.away}</b></td><td>${ls.H.away}</td><td>${ls.E.away}</td></tr>
          <tr><td class="nm">${esc(h)}</td>${innTd(ls.home)}<td><b>${ls.R.home}</b></td><td>${ls.H.home}</td><td>${ls.E.home}</td></tr>
        </tbody></table></div>

      <h3 style="font-size:14px;margin:14px 0 8px;color:var(--gold)">打擊成績 · ${esc(a)}</h3>
      ${batTable('away')}
      <h3 style="font-size:14px;margin:14px 0 8px;color:var(--gold)">打擊成績 · ${esc(h)}</h3>
      ${batTable('home')}

      <h3 style="font-size:14px;margin:14px 0 8px;color:var(--gold)">投手成績</h3>
      <p class="note" style="margin:0 0 6px">${esc(a)}</p>${pitTable('away')}
      <div style="height:8px"></div>
      <p class="note" style="margin:0 0 6px">${esc(h)}</p>${pitTable('home')}

      <h3 style="font-size:14px;margin:16px 0 8px;color:var(--gold)">逐局打席紀錄</h3>
      ${paLogHtml(null, true)}

      <div class="row" style="margin:16px 0 8px;gap:8px">
        <button class="btn ghost block" id="r-home">← 回到首頁</button>
        <button class="btn primary block" id="r-xlsx">輸出 Excel</button>
      </div>
      ${live && !g.finished ? '<button class="btn block" id="r-back" style="margin-bottom:20px">返回比賽</button>' : ''}
      ${live && g.finished ? '<button class="btn block" id="r-new" style="margin-bottom:20px">再來一場（重新排先發）</button>' : ''}
    `;

    $('#r-home').addEventListener('click', () => { S.endView(); archiveView = false; Setup.goHome(); });
    $('#r-xlsx').addEventListener('click', () => Export.xlsx());
    const th = $('#btn-res-home'), tx = $('#btn-res-xlsx');
    if (th) th.onclick = () => { S.endView(); archiveView = false; Setup.goHome(); };
    if (tx) tx.onclick = () => Export.xlsx();
    const rb = $('#r-back');
    if (rb) rb.addEventListener('click', () => { showScreen('scr-game'); render(); });
    const rn = $('#r-new');
    if (rn) rn.addEventListener('click', () => {
      Setup.goHome();
      toast('請按「開始比賽」排新先發');
    });
    showScreen('scr-result');
    window.scrollTo(0, 0);
  }

  /* ---------------- 初始化 ---------------- */
  function enter() {
    if (!S.game) { Setup.goHome(); return; }
    if (S.game.finished) { showResult(); return; }
    showScreen('scr-game');
    const mb = $('#btn-menu');
    if (mb) mb.onclick = openMenu;
    render();
  }

  window.Game = { enter, render, showResult, openPitcher };
})();

</script>
<script>
/* ---------------------------------------------------------
   export.js — 把整場比賽輸出成 Excel (.xlsx)
   --------------------------------------------------------- */
(function () {
  'use strict';

  const S_ = () => S;
  const avg = (h, ab) => (ab ? h / ab : '');

  function pad(n) { return String(n).padStart(2, '0'); }
  function stamp() {
    const d = new Date();
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
  }

  function xlsx() {
    const g = S.game;
    if (!g) { UI.toast('還沒有比賽可以匯出'); return; }
    const ls = S.lineScore();
    const A = g.teams.away.name, H = g.teams.home.name;
    const N = ls.innings;

    /* ---------- 1. 記分板 ---------- */
    const s1 = {
      name: '記分板',
      cols: [10, ...Array(N).fill(4.5), 5, 5, 5, 20],
      merges: ['A1:' + XLSX.colName(4 + N) + '1'],
      rows: []
    };
    s1.rows.push([{ v: '棒 球 比 賽 記 錄 表', s: 1 }]);
    s1.rows.push([]);
    s1.rows.push([{ v: '賽　事', s: 2 }, { v: '', s: 3 }, { v: '日　期', s: 2 }, { v: new Date().toLocaleDateString('zh-TW'), s: 3 }]);
    s1.rows.push([{ v: '客　隊', s: 2 }, { v: A, s: 3 }, { v: '主　隊', s: 2 }, { v: H, s: 3 }]);
    s1.rows.push([]);

    const head = [{ v: '球隊 ＼ 局數', s: 2 }];
    for (let i = 1; i <= N; i++) head.push({ v: i, s: 2 });
    ['R', 'H', 'E'].forEach(t => head.push({ v: t, s: 2 }));
    head.push({ v: '備註', s: 2 });
    s1.rows.push(head);

    const mk = (name, arr, R, Hh, E, tag) => {
      const r = [{ v: name, s: 7 }];
      for (let i = 0; i < N; i++) r.push({ v: arr[i] || 0, s: 3 });
      r.push({ v: R, s: 5 }, { v: Hh, s: 5 }, { v: E, s: 3 }, { v: '', s: 4 });
      return r;
    };
    s1.rows.push(mk(A, ls.away, ls.R.away, ls.H.away, ls.E.away));
    s1.rows.push(mk(H, ls.home, ls.R.home, ls.H.home, ls.E.home));
    s1.rows.push([]);
    s1.rows.push([{ v: '比賽結果', s: 2 }, { v: ls.R.away === ls.R.home ? '和局' : (ls.R.away > ls.R.home ? A + ' 勝' : H + ' 勝'), s: 5 }]);
    s1.rows.push([{ v: '結束方式', s: 2 }, { v: g.finishReason || '比賽進行中', s: 3 }]);
    s1.rows.push([{ v: '備　註', s: 2 }, { v: '由「棒球紀錄」網頁版自動產生', s: 4 }]);

    /* ---------- 2. 打擊成績 ---------- */
    const BH = ['棒次', '球員', '打數', '安打', '二安', '三安', '全壘打', '打點', '得分', '四壞', '三振', '盜壘', '盜壘刺', '打擊率'];
    const s2 = {
      name: '打擊成績',
      cols: [6, 16, 6, 6, 6, 6, 7, 6, 6, 6, 6, 6, 7, 8],
      rows: []
    };
    s2.rows.push([{ v: '打 擊 成 績', s: 1 }]);
    s2.rows.push([]);

    function block(title, team) {
      s2.rows.push([{ v: title, s: 7 }]);
      s2.rows.push(BH.map(t => ({ v: t, s: 2 })));
      const { rows, tot } = S.batting(team);
      rows.forEach(r => {
        s2.rows.push([
          { v: r.order || '', s: 3 }, { v: r.name + (r.num ? ' #' + r.num : ''), s: 4 },
          { v: r.ab, s: 3 }, { v: r.h, s: 3 }, { v: r.b2, s: 3 }, { v: r.b3, s: 3 }, { v: r.hr, s: 3 },
          { v: r.rbi, s: 3 }, { v: r.r, s: 3 }, { v: r.bb, s: 3 }, { v: r.k, s: 3 },
          { v: r.sb, s: 3 }, { v: r.cs, s: 3 },
          { v: r.ab ? +avg(r.h, r.ab).toFixed(3) : '', s: 6 }
        ]);
      });
      s2.rows.push([
        { v: '', s: 5 }, { v: '合　計', s: 5 }, { v: tot.ab, s: 5 }, { v: tot.h, s: 5 },
        { v: tot.b2, s: 5 }, { v: tot.b3, s: 5 }, { v: tot.hr, s: 5 }, { v: tot.rbi, s: 5 },
        { v: tot.r, s: 5 }, { v: tot.bb, s: 5 }, { v: tot.k, s: 5 }, { v: tot.sb, s: 5 },
        { v: tot.cs, s: 5 }, { v: tot.ab ? +avg(tot.h, tot.ab).toFixed(3) : '', s: 6 }
      ]);
      s2.rows.push([]);
    }
    block(A, 'away');
    block(H, 'home');

    /* ---------- 3. 投手成績 ---------- */
    const PH = ['投手', '局數', '打席', '球數', '被安打', '被全壘打', '四壞', '死球', '三振', '失分', '自責分', '防禦率'];
    const s3 = { name: '投手成績', cols: [18, 7, 7, 7, 8, 9, 7, 7, 7, 7, 8, 8], rows: [] };
    s3.rows.push([{ v: '投 手 成 績', s: 1 }]);
    s3.rows.push([]);
    function pblock(title, team) {
      s3.rows.push([{ v: title, s: 7 }]);
      s3.rows.push(PH.map(t => ({ v: t, s: 2 })));
      const { rows } = S.pitching(team);
      if (!rows.length) s3.rows.push([{ v: '無資料', s: 3 }]);
      rows.forEach(r => {
        s3.rows.push([
          { v: r.name + (r.num ? ' #' + r.num : ''), s: 4 },
          { v: r.ip, s: 3 }, { v: r.bf, s: 3 }, { v: r.pitches, s: 3 }, { v: r.h, s: 3 },
          { v: r.hr, s: 3 }, { v: r.bb, s: 3 }, { v: r.hbp, s: 3 }, { v: r.k, s: 3 },
          { v: r.r, s: 3 }, { v: r.er, s: 3 },
          { v: r.era == null ? '' : +r.era.toFixed(2), s: 3 }
        ]);
      });
      s3.rows.push([]);
    }
    pblock(A, 'away');
    pblock(H, 'home');
    s3.rows.push([{ v: '註：局數 6.2 代表 6⅔ 局（.1＝⅓、.2＝⅔）；防禦率＝自責分 ×27 ÷ 出局數', s: 8 }]);

    /* ---------- 4. 逐打席 ---------- */
    const s4 = { name: '逐打席紀錄', cols: [6, 8, 20, 14, 22, 10, 8, 8], rows: [] };
    s4.rows.push([{ v: '逐 打 席 紀 錄', s: 1 }]);
    s4.rows.push([]);
    s4.rows.push(['局', '壘方', '打者', '結果', '傳球', '打點', '得分', '球數'].map(t => ({ v: t, s: 2 })));
    g.pa.forEach(p => {
      s4.rows.push([
        { v: p.inn + (p.half === 'top' ? '上' : '下'), s: 3 },
        { v: g.teams[p.team].name, s: 3 },
        { v: S.pname(p.batter), s: 4 },
        { v: p.code + (p.kind === 'hit' && p.bases > 1 ? '' : ''), s: 3 },
        { v: p.seq || '', s: 3 },
        { v: p.rbi || 0, s: 3 },
        { v: p.runs || 0, s: 3 },
        { v: (p.balls || 0) + '-' + (p.strikes || 0), s: 3 }
      ]);
    });

    const fn = `棒球紀錄_${A}_vs_${H}_${stamp()}.xlsx`.replace(/[\\/:*?"<>|]/g, '_');
    XLSX.save([s1, s2, s3, s4], fn);
    UI.toast('已產生 Excel 檔');
  }

  window.Export = { xlsx };
})();

</script>
<script>
/* ---------------------------------------------------------
   boot.js — 啟動
   --------------------------------------------------------- */
(function () {
  'use strict';
  function boot() {
    S.load();
    Setup.init();

    document.addEventListener('visibilitychange', () => { if (document.hidden) S.save(); });

    // 避免 iOS 雙擊縮放
    let last = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - last < 300) e.preventDefault();
      last = now;
    }, { passive: false });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
